name: CI/CD Pipeline - Validación y Despliegue en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages mediante GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue concurrente para evitar colisiones
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # FASE 1: VALIDACIÓN AUTOMATIZADA
  # -------------------------------------------------------------
  validate:
    name: 🧪 Validación de la Aplicación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js para pruebas
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxis de JavaScript
        run: node --check js/app.js

      - name: Ejecutar pruebas de integridad
        run: node tests/validate.js

  # -------------------------------------------------------------
  # FASE 2: DESPLIEGUE CONTINUO EN GITHUB PAGES
  # -------------------------------------------------------------
  deploy:
    name: 🚀 Despliegue en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
